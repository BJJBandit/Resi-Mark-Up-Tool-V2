# Parallel Flange Channels – Grade 300 (300PLUS) to AS/NZS 3679.1.
# Units: mm, mm², mm⁴, mm³, mm⁶, kg/m, MPa.  x = major axis, y = minor axis.
# xL = centroid from the back of the web.  Zy is the elastic modulus to the flange TOE
# (the smaller of the two, = Iy/(bf − xL)); Zy_back = Iy/xL is given for completeness.
# fy by thickness per AS 4100 Table 2.1 for AS/NZS 3679.1 Grade 300 (see ub.yaml).
# NOTHING BELOW IS VERIFIED against the InfraBuild / Liberty catalogue – see ub.yaml header.
