        decks: true
      - unit: garage
        class: 10a
        floor: slab_on_ground
    expected:
      site_class: S
      wind_class: N3
      bal: 29
      bracing_types: [d, "h(B)", g]
    arch_pages:
      cover: 1
      site_plan: 3
      floor_plan: 7
      structural_slab_lower: 12
      structural_slab_upper: 13
      section: 14
      bracing_lintel_plan: 19
      roof_plan: 23
