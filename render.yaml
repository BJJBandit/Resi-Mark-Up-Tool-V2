# Render Blueprint
# Docs: https://render.com/docs/blueprint-spec

# Shared Claude API settings (non-secret). Any service can pull these in with:
#
#   envVars:
#     - fromGroup: claude-api
#
envVarGroups:
  - name: claude-api
    envVars:
      # Default model the app should use for Claude requests.
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5

services:
  - type: web
    name: resi-mark-up-tool
    runtime: python
    plan: starter  # free instances sleep and lose in-progress jobs
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - fromGroup: claude-api
      # Secret: Render prompts for the value when the Blueprint is first
      # created. Get a key at https://platform.claude.com/settings/keys
      - key: ANTHROPIC_API_KEY
        sync: false
      # Secret: shared password for the app (browser asks for it; any user name).
      # Set it in the service's Environment tab - without it the app is open.
      - key: APP_PASSWORD
        sync: false
      # Finished reviews are saved here so they survive restarts / redeploys.
      - key: JOBS_DIR
        value: /var/data/jobs
      # Minutes a review waits for answers to its information requests before carrying on
      # with the assumptions.
      # Minutes a paused review waits before carrying on unchanged.
      - key: PAUSE_MAX_MINUTES
        value: "120"
      - key: INFO_WAIT_MINUTES
        value: "30"
      - key: PYTHON_VERSION
        value: 3.13.1
      # Reasoning depth for each Claude call: low | medium | high | xhigh | max
      - key: ANTHROPIC_EFFORT
        value: high
      # Step 2 (architectural review) - medium to control cost; high if quality drops.
      - key: ANTHROPIC_DESIGN_EFFORT
        value: medium
      # Stored text extracts of standards / guides (app/refstore.py) live on the
      # persistent disk below, so each page is read from the PDF only once ever.
      # Most pages of standards / guides sent per review (all documents together).
      - key: REF_PAGE_CAP
        value: "150"
      - key: REF_STORE_DIR
        value: /var/data/references
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
