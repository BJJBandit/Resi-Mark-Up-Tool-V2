# Render Blueprint
# Docs: https://render.com/docs/blueprint-spec

# Shared Claude API settings. Any service can pull these in with:
#
#   envVars:
#     - fromGroup: claude-api
#
envVarGroups:
  - name: claude-api
    envVars:
      # Secret: Render prompts for the value when the Blueprint is first
      # created. Get a key at https://platform.claude.com/settings/keys
      - key: ANTHROPIC_API_KEY
        sync: false
      # Default model the app should use for Claude requests.
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5

# Add services below as the app takes shape. Example web service:
#
#   services:
#     - type: web
#       name: resi-mark-up-tool
#       runtime: node
#       plan: free
#       buildCommand: npm install && npm run build
#       startCommand: npm start
#       envVars:
#         - fromGroup: claude-api
#         - key: NODE_ENV
#           value: production

services: []
